name: Publish crate and WASM release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hapin-release-main
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/check.yml
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      crate_exists: ${{ steps.plan.outputs.crate_exists }}
      release_exists: ${{ steps.plan.outputs.release_exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        run: python3 scripts/release-plan.py
        env:
          GH_TOKEN: ${{ github.token }}
  crate:
    needs: [validate, plan]
    if: needs.plan.outputs.crate_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - id: auth
        name: Check crates.io configuration
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Crate publication skipped: configure the CARGO_REGISTRY_TOKEN repository secret, then rerun this workflow.'
            echo '### crates.io: not published' >> "$GITHUB_STEP_SUMMARY"
            echo 'Set CARGO_REGISTRY_TOKEN under Settings → Secrets and variables → Actions, then rerun this workflow. WASM release is independent.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.auth.outputs.configured == 'true'
        name: Publish new crate version
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  github-release:
    needs: [validate, plan]
    if: needs.plan.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-packages
          path: release-dist
      - name: Publish complete WASM release
        run: python3 scripts/publish-release.py
        env:
          GH_TOKEN: ${{ github.token }}
